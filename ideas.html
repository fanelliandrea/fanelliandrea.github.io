<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ideas — Andrea Fanelli</title>
    <meta
      name="description"
      content="A playlist of ideas on a soft sunset field."
    />
    <script>
      document.documentElement.classList.add("js");
    </script>
    <link rel="stylesheet" href="/design/tokens.css" />
    <link rel="stylesheet" href="/css/site.css?v=ideas-photos" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
    ></script>
    <script defer src="/js/site.js"></script>
    <script defer src="/js/space.js"></script>
    <script defer src="/js/ideas-playlist.js?v=ideas-photos"></script>
  </head>
  <body id="top" data-page="ideas">
    <main>
      <section
        class="ideas-pl"
        data-ideas-playlist
        aria-label="Ideas playlist"
      >
        <h1 class="visually-hidden">Ideas</h1>
        <div class="ideas-pl__stage">
          <div class="ideas-pl__orbit" aria-live="polite"></div>
          <div class="ideas-pl__focus" data-ideas-focus>
            <p class="ideas-pl__kicker" data-ideas-kicker>Playlist</p>
            <h2 class="ideas-pl__title" data-ideas-title></h2>
            <p class="ideas-pl__blurb" data-ideas-blurb></p>
            <a class="ideas-pl__cta" data-ideas-cta href="#">Open idea</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
