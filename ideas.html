<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ideas — Andrea Fanelli</title>
    <meta
      name="description"
      content="Notes and essays in a mouse-driven cover flow."
    />
    <script>
      document.documentElement.classList.add("js");
    </script>
    <link rel="stylesheet" href="/design/tokens.css" />
    <link rel="stylesheet" href="/css/site.css" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
    ></script>
    <script defer src="/js/site.js"></script>
    <script defer src="/js/space.js"></script>
    <script defer src="/js/effect114.js"></script>
  </head>
  <body id="top" data-page="ideas">
    <main>
      <section class="ideas-114" data-effect-114 aria-label="Ideas gallery">
        <div class="ideas-114__stage">
          <div class="ideas-114__title">
            <h1>Ideas</h1>
            <p>Move to bring a note into focus</p>
          </div>
          <div class="ideas-114__rail" aria-live="polite"></div>
          <div class="ideas-114__caption" data-ideas-caption>
            <span class="ideas-114__caption-index"></span>
            <span class="ideas-114__caption-title"></span>
          </div>
        </div>
      </section>
    </main>

    <div class="hint" data-move-hint>
      Move
      <span class="hint__arrow hint__arrow--x" aria-hidden="true"></span>
    </div>
  </body>
</html>
