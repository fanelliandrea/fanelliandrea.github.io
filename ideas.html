<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ideas — Andrea Fanelli</title>
    <meta
      name="description"
      content="Notes and essays in a mouse-driven cover flow."
    />
    <script>
      document.documentElement.classList.add("js");
    </script>
    <link rel="stylesheet" href="/design/tokens.css" />
    <link rel="stylesheet" href="/css/site.css?v=ideas-pastel" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
    ></script>
    <script defer src="/js/site.js"></script>
    <script defer src="/js/space.js"></script>
    <script defer src="/js/effect114.js?v=ideas-pastel"></script>
  </head>
  <body id="top" data-page="ideas">
    <main>
      <section class="ideas-114" data-effect-114 aria-label="Ideas gallery">
        <div class="ideas-114__stage">
          <h1 class="visually-hidden">Ideas</h1>
          <div class="ideas-114__rail" aria-live="polite"></div>
          <div class="ideas-114__nav" data-ideas-nav>
            <button
              class="ideas-114__arrow"
              type="button"
              data-ideas-prev
              aria-label="Previous idea"
            >
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                <path
                  d="M10.2 3.2L5.4 8l4.8 4.8"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <button
              class="ideas-114__arrow"
              type="button"
              data-ideas-next
              aria-label="Next idea"
            >
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                <path
                  d="M5.8 3.2L10.6 8l-4.8 4.8"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
          <div class="ideas-114__caption" data-ideas-caption>
            <span class="ideas-114__caption-index"></span>
            <span class="ideas-114__caption-title"></span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
