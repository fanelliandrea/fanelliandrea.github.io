      <h1>DROPL</h1>
      <p class="case-meta">— · Product & Service design</p>
      <p>During 2020, I found that in the world there are over 1.7 billion people still do not have basic sanitation services, such as private toilets or latrines. Every day there are about 800 children who die from water and sanitation problems that could be prevented. That is why I decided to choose sanitation for my thesis project and get out into the field to design a solution to help solve the problem.</p>
