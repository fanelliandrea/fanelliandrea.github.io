      <h1>The Process Is the Product</h1>
      <p class="case-meta">Notes · Journal</p>
      <p>The real value of creativity doesn't lie in the final product, but more in the journey to get there. By documenting and sharing the behind-the-scenes, complete with iterations, mistakes and insights, we reveal the authenticity of our work. In a world obsessed with perfection, embracing and showing imperfections becomes a powerful act of transparency and connection.</p>
