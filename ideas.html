<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ideas — Andrea Fanelli</title>
    <meta
      name="description"
      content="A playlist of ideas on the daylight sky."
    />
    <script>
      document.documentElement.classList.add("js");
    </script>
    <link rel="stylesheet" href="/design/tokens.css" />
    <link rel="stylesheet" href="/css/site.css?v=ideas-airy11" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
    ></script>
    <script defer src="/js/site.js"></script>
    <script defer src="/js/space.js"></script>
    <script defer src="/js/ideas-playlist.js?v=ideas-airy11"></script>
  </head>
  <body id="top" data-page="ideas">
    <main>
      <section
        class="ideas-pl"
        data-ideas-playlist
        aria-label="Ideas playlist"
      >
        <h1 class="visually-hidden">Ideas</h1>
        <div class="ideas-pl__stage">
          <div class="ideas-pl__orbit" aria-live="polite"></div>
          <div class="ideas-pl__focus" data-ideas-focus>
            <h2 class="ideas-pl__title" data-ideas-title></h2>
            <a class="ideas-pl__cta" data-ideas-cta href="#">Read</a>
          </div>
          <div class="ideas-pl__nav" data-ideas-nav>
            <button
              class="ideas-pl__arrow"
              type="button"
              data-ideas-prev
              aria-label="Previous idea"
            >
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                <path
                  d="M10.2 3.2L5.4 8l4.8 4.8"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <button
              class="ideas-pl__arrow"
              type="button"
              data-ideas-next
              aria-label="Next idea"
            >
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                <path
                  d="M5.8 3.2L10.6 8l-4.8 4.8"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
