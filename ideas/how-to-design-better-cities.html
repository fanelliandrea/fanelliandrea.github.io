      <h1>How to design better cities?</h1>
      <p class="case-meta">Notes · Journal</p>
      <p>By designing them for its users, who are the people. It takes space to do that, but in the end it has a big impact on their daily lives. Multimodal cities give people the power and options to decide how to get around. Access to services depends on density and proximity, and doing so results in compact, walkable cities with human-scale neighborhoods. By bringing people together, you get a side effect: better communities.</p>
